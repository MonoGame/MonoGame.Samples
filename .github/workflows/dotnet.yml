# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    branches:
      - '3.8.*'
  pull_request:
    branches:
      - '3.8.*'
  schedule:
    - cron: "0 3 * * 1"   # Weekly (Mon) build to keep artifacts fresh

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
    
    - name: Build Windows Binary for Tutorial/BasicCameraExample
      run: dotnet build Tutorials/BasicCameraExample/BasicCameraExample.sln

    - name: Archive Tutorial/BasicCameraExample
      uses: actions/upload-artifact@v6
      with:
        name: Windows-BasicCameraExample
        path: Tutorials/BasicCameraExample/**
        include-hidden-files: true

    - name: Build Windows Binary for AutoPong
      run: dotnet build AutoPong/AutoPong.WindowsDX/AutoPong.WindowsDX.csproj

    - name: Archive AutoPong
      uses: actions/upload-artifact@v6
      with:
        name: Windows-AutoPong
        path: AutoPong/**
        include-hidden-files: true

    - name: Build Windows Binary for FuelCell
      run: dotnet build FuelCell/FuelCell.WindowsDX/FuelCell.WindowsDX.csproj

    - name: Archive FuelCell
      uses: actions/upload-artifact@v6
      with:
        name: Windows-FuelCell
        path: FuelCell/**
        include-hidden-files: true

    - name: Build Windows Binary for NeonShooter
      run: dotnet build NeonShooter/NeonShooter.WindowsDX/NeonShooter.WindowsDX.csproj

    - name: Archive NeonShooter
      uses: actions/upload-artifact@v6
      with:
        name: Windows-NeonShooter
        path: NeonShooter/**
        include-hidden-files: true

    - name: Build Windows Binary for Platformer2D
      run: dotnet build Platformer2D/Platformer2D.WindowsDX/Platformer2D.WindowsDX.csproj

    - name: Archive Platformer2D
      uses: actions/upload-artifact@v6
      with:
        name: Windows-Platformer2D
        path: Platformer2D/**
        include-hidden-files: true

    - name: Build ShipGame Content Processor in Release mode
      run: dotnet build ShipGame/ShipGame.Dependencies/NormalMappingModelProcessor/NormalMappingModelProcessor.csproj --configuration Release

    - name: Build Windows Binary for ShipGame
      run: dotnet build ShipGame/ShipGame.WindowsDX/ShipGame.WindowsDX.csproj

    - name: Archive ShipGame
      uses: actions/upload-artifact@v6
      with:
        name: Windows-ShipGame
        path: ShipGame/**
        include-hidden-files: true

    - name: Build learn-monogame-2d Binary
      run: dotnet build Tutorials/learn-monogame-2d/src/27-Conclusion/DungeonSlime/DungeonSlime.csproj --configuration Release

    - name: Archive learn-monogame-2d
      uses: actions/upload-artifact@v6
      with:
        name: Windows-Learn-monogame-2d
        path: Tutorials/learn-monogame-2d/src/27-Conclusion/**
        include-hidden-files: true

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    # Install workloads
    - name: Install .NET workloads
      run: |
        dotnet workload install macos
        dotnet workload install ios
        dotnet workload install android

    # Install MonoPack
    - name: Install MonoPack
      run: dotnet tool install --global MonoPack

    - name: Setup Wine 
      run: wget -qO- https://monogame.net/downloads/net9_mgfxc_wine_setup.sh | bash

    # Build ShipGame content processor first (required dependency)
    - name: Build ShipGame Content Processor
      run: dotnet build ShipGame/ShipGame.Dependencies/NormalMappingModelProcessor/NormalMappingModelProcessor.csproj --configuration Release

    # Build all DesktopGL projects (creates binaries for Windows, Linux, macOS)
    - name: Build all DesktopGL projects
      run: |
        dotnet build AutoPong/AutoPong.DesktopGL/AutoPong.DesktopGL.csproj
        dotnet build FuelCell/FuelCell.DesktopGL/FuelCell.DesktopGL.csproj
        dotnet build NeonShooter/NeonShooter.DesktopGL/NeonShooter.DesktopGL.csproj
        dotnet build Platformer2D/Platformer2D.DesktopGL/Platformer2D.DesktopGL.csproj
        dotnet build ShipGame/ShipGame.DesktopGL/ShipGame.DesktopGL.csproj

    # Create macOS standalone binaries with MonoPack (universal: Intel + Apple Silicon)
    - name: Package AutoPong for macOS with MonoPack
      working-directory: AutoPong/AutoPong.DesktopGL
      run: monopack -r osx-x64 -r osx-arm64 -o ../../artifacts/macOS/AutoPong

    - name: Package FuelCell for macOS with MonoPack
      working-directory: FuelCell/FuelCell.DesktopGL
      run: monopack -r osx-x64 -r osx-arm64 -o ../../artifacts/macOS/FuelCell

    - name: Package NeonShooter for macOS with MonoPack
      working-directory: NeonShooter/NeonShooter.DesktopGL
      run: monopack -r osx-x64 -r osx-arm64 -o ../../artifacts/macOS/NeonShooter

    - name: Package Platformer2D for macOS with MonoPack
      working-directory: Platformer2D/Platformer2D.DesktopGL
      run: monopack -r osx-x64 -r osx-arm64 -o ../../artifacts/macOS/Platformer2D

    - name: Package ShipGame for macOS with MonoPack
      working-directory: ShipGame/ShipGame.DesktopGL
      run: monopack -r osx-x64 -r osx-arm64 -o ../../artifacts/macOS/ShipGame

    # Upload macOS artifacts
    - name: Upload macOS AutoPong
      uses: actions/upload-artifact@v6
      with:
        name: macOS-AutoPong
        path: artifacts/macOS/AutoPong/**
        include-hidden-files: true

    - name: Upload macOS FuelCell
      uses: actions/upload-artifact@v6
      with:
        name: macOS-FuelCell
        path: artifacts/macOS/FuelCell/**
        include-hidden-files: true

    - name: Upload macOS NeonShooter
      uses: actions/upload-artifact@v6
      with:
        name: macOS-NeonShooter
        path: artifacts/macOS/NeonShooter/**
        include-hidden-files: true

    - name: Upload macOS Platformer2D
      uses: actions/upload-artifact@v6
      with:
        name: macOS-Platformer2D
        path: artifacts/macOS/Platformer2D/**
        include-hidden-files: true

    - name: Upload macOS ShipGame
      uses: actions/upload-artifact@v6
      with:
        name: macOS-ShipGame
        path: artifacts/macOS/ShipGame/**
        include-hidden-files: true

  deploy:
      name: Deploy
      needs: [ build-windows, build-macos ]
      runs-on: ubuntu-latest
      if: ${{ github.event_name == 'push' }}
      permissions:
          packages: write
          contents: write
      steps:
          - name: Clone Repository
            uses: actions/checkout@v4
          - name: Expose GitHub Runtime
            uses: crazy-max/ghaction-github-runtime@v3
          - name: Make a Release
            if: github.ref_type == 'tag'
            uses: ncipollo/release-action@v1
            with:
              name: 'MonoGame ${{ github.ref_name }}'
              tag: ${{ github.ref_name }}
              allowUpdates: true
              removeArtifacts: true
              artifacts: "*.zip"
              token: ${{ secrets.GITHUB_TOKEN }}
